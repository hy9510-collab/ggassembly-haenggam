name: 매일 기사 수집·배포

on:
  schedule:
    - cron: '0 22 * * *'      # 매일 한국시간 오전 7시 (UTC 22:00)
  workflow_dispatch:           # 깃허브 화면에서 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 기사 수집
        run: python 뉴스수집.py

      - name: 바뀐 내용 올리기
        run: |
          git config user.name "haenggam-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news_data.js
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 올리지 않았습니다."
          else
            git commit -m "chore: 기사 자동 수집 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
